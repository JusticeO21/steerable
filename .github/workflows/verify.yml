name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  render:
    name: render frontend template
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - run: uv tool install copier

      - name: Render frontend and check the output
        run: uv run --no-project python check-template.py

  generated-gates:
    name: generated frontend passes its own gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: uv tool install copier

      - name: Render the standalone frontend with its defaults
        run: copier copy --trust --defaults --overwrite . "${{ runner.temp }}/generated"

      # husky's installer fails outside a git work tree, and pnpm runs it from
      # the `prepare` lifecycle script during install.
      - name: Initialize the generated repository
        working-directory: ${{ runner.temp }}/generated
        run: git init --quiet

      - name: Set up the generated frontend
        working-directory: ${{ runner.temp }}/generated
        run: pnpm install --no-frozen-lockfile

      - name: Run the generated check command
        working-directory: ${{ runner.temp }}/generated
        run: pnpm run check
