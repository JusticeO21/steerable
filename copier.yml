_min_copier_version: "9.4.0"
_answers_file: .steerable/answers.yml
_subdirectory: template
_templates_suffix: .jinja
# Copier skips a directory whose rendered name is empty, but keeps a directory
# whose files all render empty. Prune the frontend staging directory so the
# generated application has its own root-level `src/`.
_tasks:
  # A repo generated by the published v1 has its frontend as static files that
  # run frontend setup from the template root; v2 writes it from setup.py. An
  # update from a v1 repo would run the old frontend task list and copy the
  # static tree back into a project. `_commit` is v1's release tag there, so
  # the guard stops the run before anything is written; a fresh copy has no
  # answers file yet and skips it. The message is single-quoted for the shell:
  # copier starts tasks through a shell, and a double quote would end the -c.
  - >-
    python -c "import pathlib, sys;
    p = pathlib.Path('.steerable/answers.yml');
    text = p.read_text(encoding='utf-8') if p.exists() else '';
    v1 = any(l.split(':', 1)[0].strip() == '_commit' and l.split(':', 1)[1].strip().strip('\"') == 'v1' for l in text.splitlines());
    sys.exit('refusing to update a repo generated by template v1; see Upgrading from v1 in the template README' if v1 else 0)"
  # Run before pruning src/frontend: Copier renders the FSD ESLint config there,
  # and the generator moves it to the standalone repository root.
  - command: ["{{ _copier_python }}", "{{ _copier_conf.src_path }}/template/src/frontend/setup.py"]
    working_directory: .
  - >-
    python -c "import os, pathlib, shutil;
    root = pathlib.Path(os.getcwd());
    staging = [root / 'src/frontend'] if {{ _copier_operation == 'copy' }} else [root / 'src/frontend/setup.py', root / 'src/frontend/eslint.config.mjs'];
    [shutil.rmtree(p) if p.is_dir() else p.unlink() for p in staging if p.exists()];
    [d.rmdir() for d in sorted(root.rglob('*'), reverse=True) if d.is_dir() and not {'node_modules', '.git'} & set(d.parts) and not any(d.iterdir())]"
  - >-
    python -c "import os, pathlib, shutil;
    root = pathlib.Path(os.getcwd());
    [d.rmdir() for d in sorted(root.rglob('*'), reverse=True) if d.is_dir() and not {'node_modules', '.git'} & set(d.parts) and not any(d.iterdir())]"
    when: "{{ _copier_operation == 'update' }}"
  - >-
    python -c "import pathlib;
    pathlib.Path('{{ frontend_root }}/setup.py').unlink(missing_ok=True)"

_message_before_copy: |
  This template generates a standalone frontend repository whose AGENTS.md
  and docs/ hold the same rules for every project.
_message_after_copy: |
  Created {{ project_name }} (standalone frontend).

  Start here, in this order:
    1. docs/architecture/overview.md  - the architecture the docs describe
    2. docs/product/business-rules.md - rule IDs every test references
    3. AGENTS.md                      - the rules every agent must follow

  Then read "START HERE" in AGENTS.md and complete the first-run steps.

# Answers that describe the template, not the project: they would be empty or
# wrong in .copier-answers.yml, so they are not recorded. Questions without a
# default are secret by necessity (copier refuses to reuse stored answers that
# it would not ask anyway).
_secret_questions:
  - project_type
  - product_summary
  - business_rules_source
  - frontend_language
  - design_system
  - api_client_command
  - openapi_schema
  - repo_layout
  - tiering_hook
  - dev_server_probe
  - frontend_unit_command
  - frontend_typecheck_command
  - frontend_lint_command
  - fsd_lint_command
  - e2e_command
  - ci_gates

# Internal flag is fixed; this template generates frontend projects only.
frontend:
  type: bool
  default: true
  ask: false
  validator: >-
    {% if not frontend %}
    Steerable generates frontend-only repositories; frontend must be true.
    {% endif %}

project_type:
  type: str
  help: Scope of the repository
  when: "false"
  choices:
    Frontend only: frontend-only
  default: frontend-only

# Project-specific details use defaults during generation so Copier only asks
# which scopes to include. Override any answer with `-d key=value`; the
# generated TODO markers identify details the project should fill in later.

project_name:
  type: str
  help: Repository name
  default: "{{ _copier_conf.dst_path.name }}"
  ask: false

product_summary:
  type: str
  multiline: true
  help: >-
    What does the product do, who uses it, and what is the one thing it must get
    right? Written next to a README's first paragraph.
  default: >-
    TODO: replace with 2-3 sentences. Name the user, the job the product does,
    and the single invariant that must never break.
  ask: false

business_rules_source:
  type: str
  help: >-
    How business rules get their IDs - human-maintained, a ticket system, or
    domain experts. Rule IDs are cited by tests and mirrored UI rules.
  default: >-
    TODO: name the source of truth for business rules and how a rule is
    numbered (for example: product owner keeps BR-<AREA>-<NN> in the tracker).
  ask: false

frontend_language:
  type: str
  help: Language of the frontend (shown in AGENTS.md conventions)
  default: TypeScript
  when: "{{ frontend }}"
  ask: false

package_manager:
  type: str
  choices:
    - pnpm
    - npm
    - yarn
    - bun
  default: pnpm
  when: "{{ frontend }}"
  ask: false

ui_stack:
  type: str
  choices:
    - Vite + React SPA
  default: Vite + React SPA
  when: "{{ frontend }}"
  ask: false

design_system:
  type: str
  help: Component and styling foundation used for shared/ui
  default: Radix primitives + Tailwind CSS
  when: "{{ frontend }}"
  ask: false

api_client_command:
  type: str
  help: Command that regenerates types from the OpenAPI schema
  default: "{{ package_manager }} gen:api"
  when: "{{ frontend }}"
  ask: false

openapi_schema:
  type: str
  help: >-
    The path or URL `pnpm gen:api` (openapi-typescript) reads the schema from,
    e.g. ./openapi.json or https://api.example.com/openapi.json. Replace the
    default with the API's published schema address when it is known.
  when: "{{ frontend }}"
  default: https://api.example.com/openapi.json
  ask: false

frontend_root:
  type: str
  help: Frontend package and config root (relative)
  default: .
  when: "{{ frontend }}"
  ask: false
  validator: >-
    {% if frontend_root != '.' %}
    Standalone frontend files must be generated at the repository root.
    {% endif %}

frontend_source_root:
  type: str
  help: Frontend Feature-Sliced Design source root (relative)
  default: src
  when: "{{ frontend }}"
  ask: false
  validator: >-
    {% if frontend_source_root != 'src' %}
    Standalone frontend source must be generated under src/.
    {% endif %}

setup_command:
  type: str
  help: One-time setup command
  default: >-
    {{ package_manager }} install && chmod +x .husky/pre-commit && git config core.hooksPath .husky

dev_command:
  type: str
  help: Command that starts the local dev environment
  default: "{{ package_manager }} dev"

check_command:
  type: str
  help: Command that runs every CI gate
  default: "{{ package_manager }} run check"

frontend_unit_command:
  type: str
  help: Command that runs frontend unit/component tests
  when: "{{ frontend }}"
  default: "{{ package_manager }} test"
  ask: false

frontend_typecheck_command:
  type: str
  help: Command that type-checks the frontend
  when: "{{ frontend }}"
  default: "{{ package_manager }} typecheck"
  ask: false

frontend_lint_command:
  type: str
  help: Command that lints the frontend (ESLint)
  when: "{{ frontend }}"
  default: "{{ package_manager }} lint"
  ask: false

fsd_lint_command:
  type: str
  help: Command that enforces Feature-Sliced Design boundaries
  when: "{{ frontend }}"
  default: "{{ package_manager }} lint:fsd"
  ask: false

e2e_gate:
  type: bool
  help: >-
    Does this repository run Playwright e2e in CI now? It needs a browser
    download and a dev server; turn it on once the first journey exists.
  when: "{{ frontend }}"
  default: false
  ask: false

e2e_command:
  type: str
  help: Command that runs end-to-end tests
  when: "{{ frontend }}"
  default: "{{ package_manager }} test:e2e"
  ask: false

dev_server_probe:
  type: str
  help: 'Command that proves the dev server answers, e.g. curl -f http://localhost:5173/'
  default: curl -f http://localhost:5173/
  ask: false

repo_layout:
  type: str
  help: List subdirectories that own source or configuration, e.g. packages/shared
  default: ""
  ask: false

tiering_hook:
  type: str
  help: >-
    How does an agent learn which rule applies to a file it is about to edit
    (a table, a mapping file, or the convention "read the matching doc first")?
  default: >-
    docs/architecture/path-rules.md has a "Which rules apply to this path" table.
    Read it before editing any path listed there.
  ask: false

ci_gates:
  type: str
  multiline: true
  ask: false
  help: Ordered list of gates that CI runs, one per line
  default: |
    {% if frontend -%}
    frontend format (prettier --check)
    frontend lint (eslint)
    frontend FSD (frontend.verify.mjs + eslint boundaries)
    frontend types (tsc --noEmit)
    frontend tests (vitest)
    {% endif -%}
    {% if frontend and e2e_gate -%}
    e2e (playwright)
    {% endif -%}
    adr-drift (docs/architecture/decisions verify)
    {% if frontend -%}
    docs-drift (frontend.verify.mjs checks frontend.md layer order)
    {% endif %}
